<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a27"/>
      <stop offset="100%" style="stop-color:#1a3d16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- Gift box body -->
  <rect x="130" y="248" width="252" height="186" rx="16" fill="white" opacity="0.95"/>
  <!-- Gift box lid -->
  <rect x="116" y="210" width="280" height="58" rx="12" fill="white"/>
  <!-- Ribbon vertical -->
  <rect x="238" y="210" width="36" height="224" fill="#c07c2e"/>
  <!-- Ribbon horizontal on lid -->
  <rect x="116" y="228" width="280" height="22" fill="#c07c2e"/>
  <!-- Bow left loop -->
  <ellipse cx="204" cy="194" rx="58" ry="30" fill="#c07c2e" transform="rotate(-20 204 194)"/>
  <!-- Bow right loop -->
  <ellipse cx="308" cy="194" rx="58" ry="30" fill="#c07c2e" transform="rotate(20 308 194)"/>
  <!-- Bow center -->
  <circle cx="256" cy="210" r="24" fill="#e09040"/>
  <!-- Small sparkles -->
  <circle cx="370" cy="140" r="8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="390" cy="165" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="148" cy="155" r="6" fill="rgba(255,255,255,0.35)"/>
</svg>
